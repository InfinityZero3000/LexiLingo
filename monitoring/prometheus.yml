global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "lexilingo-backend"
    static_configs:
      - targets: ["backend-service:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "lexilingo-ai-service"
    static_configs:
      - targets: ["ai-service:8001"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
