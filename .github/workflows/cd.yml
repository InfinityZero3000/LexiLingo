name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Flutter Web → Vercel
  # ──────────────────────────────────────────────
  deploy-flutter-web:
    name: Deploy Flutter Web → Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase_options.dart from example
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Create .env for build
        run: |
          printf 'API_BASE_URL=%s\nAI_SERVICE_URL=%s\nENABLE_VOICE_FEATURE=true\nENABLE_GAMIFICATION=true\nDEBUG_MODE=false\nGOOGLE_SERVER_CLIENT_ID=%s\n' \
            "${{ secrets.API_BASE_URL || 'https://api.lexilingo.app/api/v1' }}" \
            "${{ secrets.AI_SERVICE_URL || 'https://ai.lexilingo.app/api/v1' }}" \
            "${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" \
            > .env

      - name: Build Flutter web (release)
        run: flutter build web --release --no-pub

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
          working-directory: flutter-app
          vercel-args: "--prod"

  # ──────────────────────────────────────────────
  # Backend Docker → GitHub Container Registry
  # ──────────────────────────────────────────────
  build-backend-docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
