name: CD

on:
  push:
    branches: [main, dev]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Flutter Web → Vercel
  # ──────────────────────────────────────────────
  deploy-flutter-web:
    name: Deploy Flutter Web → Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase_options.dart
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        run: |
          : "${FIREBASE_WEB_API_KEY:?Set FIREBASE_WEB_API_KEY repository variable}"
          : "${FIREBASE_WEB_APP_ID:?Set FIREBASE_WEB_APP_ID repository variable}"
          : "${FIREBASE_MESSAGING_SENDER_ID:?Set FIREBASE_MESSAGING_SENDER_ID repository variable}"
          : "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID repository variable}"
          : "${FIREBASE_MEASUREMENT_ID:?Set FIREBASE_MEASUREMENT_ID repository variable}"
          sed \
            -e "s|YOUR_WEB_API_KEY|${FIREBASE_WEB_API_KEY}|" \
            -e "s|YOUR_WEB_APP_ID|${FIREBASE_WEB_APP_ID}|" \
            -e "s|YOUR_MESSAGING_SENDER_ID|${FIREBASE_MESSAGING_SENDER_ID}|g" \
            -e "s|YOUR_PROJECT_ID|${FIREBASE_PROJECT_ID}|g" \
            -e "s|YOUR_MEASUREMENT_ID|${FIREBASE_MEASUREMENT_ID}|" \
            lib/firebase_options.dart.example > lib/firebase_options.dart

      - name: Create public env config for build
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          : "${GOOGLE_SERVER_CLIENT_ID:?Set GOOGLE_SERVER_CLIENT_ID repository variable}"
          cat > assets/env/prod_config <<'EOF'
          ENVIRONMENT=production
          API_BASE_URL=https://api.lexilingo.me/api/v1
          API_BASE_URL_FALLBACK=
          AI_SERVICE_URL=https://api.lexilingo.me/api/v1
          AI_SERVICE_URL_FALLBACK=
          ENABLE_VOICE_FEATURE=true
          ENABLE_GAMIFICATION=true
          ENABLE_STARTER_REWARD=false
          DEBUG_MODE=false
          EOF
          printf 'GOOGLE_SERVER_CLIENT_ID=%s\n' "$GOOGLE_SERVER_CLIENT_ID" >> assets/env/prod_config

      - name: Build Flutter web (release)
        run: flutter build web --release --no-pub

      - name: Verify vocabulary collection API compatibility
        run: |
          if grep -Fq 'vocabulary/collection?limit=1000' build/web/main.dart.js; then
            echo "Unsupported vocabulary collection limit found in production bundle"
            exit 1
          fi
          grep -Fq 'vocabulary/collection?limit=100' build/web/main.dart.js

      - name: Install JS deps for Vercel hooks
        run: npm ci

      - name: Verify Vercel build prerequisites
        run: npm run vercel-build

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # ──────────────────────────────────────────────
  # Admin Dashboard → Vercel
  # ──────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin Dashboard → Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: admin-service/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-service/pnpm-lock.yaml

      - name: Install dependencies
        run: CI=true pnpm install --config.allowBuilds.esbuild=true --config.confirmModulesPurge=false

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # ──────────────────────────────────────────────
  # Backend Docker → GitHub Container Registry
  # ──────────────────────────────────────────────
  build-backend-docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
