name: CD

on:
  push:
    branches: [dev]
  # By hand: redeploy production after Vercel's daily limit held a push back, or build a
  # preview of any branch (`gh workflow run cd.yml --ref <branch> -f environment=preview`).
  # Vercel's Git integration is off (vercel.json `git.deploymentEnabled: false`): every PR
  # push created a preview, cancelled or not, and those used up the Hobby plan's 100
  # deployments a day. This workflow is the only deploy path.
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [both, web, admin]
        default: both
      environment:
        description: "production deploys only from dev; preview works from any branch"
        type: choice
        options: [production, preview]
        default: production

# Deploys go out through the Vercel CLI with repository secrets; the GITHUB_TOKEN only checks out.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  # The Hobby plan allows 100 deployments a day. Deploying both apps on every push to dev,
  # backend-only pushes included, used that up by mid-morning on 2026-11-16 and froze the web
  # app for the rest of the day. Each app now deploys only when its own files changed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      admin: ${{ steps.diff.outputs.admin }}
      vercel_env: ${{ steps.diff.outputs.vercel_env }}
      prod_flag: ${{ steps.diff.outputs.prod_flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ inputs.target }}
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
        run: |
          if [ "$ENVIRONMENT" = production ] && [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::Production deploys only from dev (got $GITHUB_REF). Use environment=preview."
            exit 1
          fi
          echo "vercel_env=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          if [ "$ENVIRONMENT" = production ]; then echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "$TARGET" != admin ] && echo "web=true" >> "$GITHUB_OUTPUT"
            [ "$TARGET" != web ] && echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Unknown base (new branch, force-push): deploy both rather than guess.
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          grep -qE '^flutter-app/' <<<"$changed" && echo "web=true" >> "$GITHUB_OUTPUT"
          grep -qE '^admin-service/' <<<"$changed" && echo "admin=true" >> "$GITHUB_OUTPUT"
          true

  # ──────────────────────────────────────────────
  # Flutter Web → Vercel
  # ──────────────────────────────────────────────
  deploy-flutter-web:
    name: Deploy Flutter Web → Vercel
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned: phosphor_flutter 2.1.0 extends IconData, which is final from Flutter 3.47 on.
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase_options.dart
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        run: |
          : "${FIREBASE_WEB_API_KEY:?Set FIREBASE_WEB_API_KEY repository variable}"
          : "${FIREBASE_WEB_APP_ID:?Set FIREBASE_WEB_APP_ID repository variable}"
          : "${FIREBASE_MESSAGING_SENDER_ID:?Set FIREBASE_MESSAGING_SENDER_ID repository variable}"
          : "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID repository variable}"
          : "${FIREBASE_MEASUREMENT_ID:?Set FIREBASE_MEASUREMENT_ID repository variable}"
          sed \
            -e "s|YOUR_WEB_API_KEY|${FIREBASE_WEB_API_KEY}|" \
            -e "s|YOUR_WEB_APP_ID|${FIREBASE_WEB_APP_ID}|" \
            -e "s|YOUR_MESSAGING_SENDER_ID|${FIREBASE_MESSAGING_SENDER_ID}|g" \
            -e "s|YOUR_PROJECT_ID|${FIREBASE_PROJECT_ID}|g" \
            -e "s|YOUR_MEASUREMENT_ID|${FIREBASE_MEASUREMENT_ID}|" \
            lib/firebase_options.dart.example > lib/firebase_options.dart

      - name: Create public env config for build
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          FCM_VAPID_KEY: ${{ vars.FCM_VAPID_KEY }}
        run: |
          : "${GOOGLE_SERVER_CLIENT_ID:?Set GOOGLE_SERVER_CLIENT_ID repository variable}"
          cat > assets/env/prod_config <<'EOF'
          ENVIRONMENT=production
          API_BASE_URL=https://api.lexilingo.me/api/v1
          API_BASE_URL_FALLBACK=
          AI_SERVICE_URL=https://api.lexilingo.me/api/v1
          AI_SERVICE_URL_FALLBACK=
          ENABLE_VOICE_FEATURE=true
          ENABLE_GAMIFICATION=true
          ENABLE_STARTER_REWARD=false
          DEBUG_MODE=false
          EOF
          printf 'GOOGLE_SERVER_CLIENT_ID=%s\n' "$GOOGLE_SERVER_CLIENT_ID" >> assets/env/prod_config
          if [ -n "$FCM_VAPID_KEY" ]; then printf 'FCM_VAPID_KEY=%s\n' "$FCM_VAPID_KEY" >> assets/env/prod_config; fi

      - name: Build Flutter web (release)
        run: flutter build web --release --no-pub

      - name: Verify vocabulary collection API compatibility
        run: |
          if grep -Fq 'vocabulary/collection?limit=1000' build/web/main.dart.js; then
            echo "Unsupported vocabulary collection limit found in production bundle"
            exit 1
          fi
          grep -Fq 'vocabulary/collection?limit=100' build/web/main.dart.js

      - name: Install JS deps for Vercel hooks
        run: npm ci

      - name: Verify Vercel build prerequisites
        run: npm run vercel-build

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
          VERCEL_ENVIRONMENT: ${{ needs.changes.outputs.vercel_env }}
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
          PROD_FLAG: ${{ needs.changes.outputs.prod_flag }}
        run: vercel build ${PROD_FLAG:+"$PROD_FLAG"} --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
          PROD_FLAG: ${{ needs.changes.outputs.prod_flag }}
        run: |
          url="$(vercel deploy --prebuilt ${PROD_FLAG:+"$PROD_FLAG"} --token "$VERCEL_TOKEN")"
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Admin Dashboard → Vercel
  # ──────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin Dashboard → Vercel
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-service

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: admin-service/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-service/pnpm-lock.yaml

      - name: Install dependencies
        run: CI=true pnpm install --config.allowBuilds.esbuild=true --config.confirmModulesPurge=false

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          VERCEL_ENVIRONMENT: ${{ needs.changes.outputs.vercel_env }}
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          PROD_FLAG: ${{ needs.changes.outputs.prod_flag }}
        run: vercel build ${PROD_FLAG:+"$PROD_FLAG"} --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          PROD_FLAG: ${{ needs.changes.outputs.prod_flag }}
        run: |
          url="$(vercel deploy --prebuilt ${PROD_FLAG:+"$PROD_FLAG"} --token "$VERCEL_TOKEN")"
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  # Backend and ai-service images are built by the `images` job in ci.yml,
  # after the tests pass, and deployed by scripts/auto-deploy.sh on the VPS.
