name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Flutter Web → Vercel
  # ──────────────────────────────────────────────
  deploy-flutter-web:
    name: Deploy Flutter Web → Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase_options.dart
        run: |
          sed \
            -e 's/YOUR_WEB_API_KEY/AIzaSyDxb89kPDmWalE3fx8Jlo45pNYMfpe-Q5I/' \
            -e 's/YOUR_WEB_APP_ID/1:432329288238:web:f34e2fdf685d5b8a718dbf/' \
            -e 's/YOUR_MESSAGING_SENDER_ID/432329288238/g' \
            -e 's/YOUR_PROJECT_ID/lexilingo-88492/g' \
            -e 's/YOUR_MEASUREMENT_ID/G-M8B2FXYJ42/' \
            lib/firebase_options.dart.example > lib/firebase_options.dart

      - name: Create env files for build
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=production
          API_BASE_URL=https://api.lexilingo.me/api/v1
          API_BASE_URL_FALLBACK=https://lexilingo-4gu6.onrender.com/api/v1
          AI_SERVICE_URL=https://api.lexilingo.me/api/v1
          AI_SERVICE_URL_FALLBACK=https://enable-tell-memphis-wing.trycloudflare.com/api/v1
          ENABLE_VOICE_FEATURE=true
          ENABLE_GAMIFICATION=true
          DEBUG_MODE=false
          GOOGLE_SERVER_CLIENT_ID=432329288238-co06he7ecljb7ubupm5mj84t3i0r1u7j.apps.googleusercontent.com
          EOF
          cp .env .env.production

      - name: Build Flutter web (release)
        run: flutter build web --release --no-pub

      - name: Install JS deps for Vercel hooks
        run: npm ci

      - name: Verify Vercel build prerequisites
        run: npm run vercel-build

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # ──────────────────────────────────────────────
  # Backend Docker → GitHub Container Registry
  # ──────────────────────────────────────────────
  build-backend-docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
