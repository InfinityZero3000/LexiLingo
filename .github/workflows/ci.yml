name: CI

on:
  push:
    branches: [main, feature, develop]
  pull_request:
    branches: [main, feature]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend — pytest + coverage
  # ──────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexilingo
          POSTGRES_PASSWORD: lexilingo_pass
          POSTGRES_DB: lexilingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://lexilingo:lexilingo_pass@localhost:5432/lexilingo_test
      SECRET_KEY: ci-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      APP_ENV: testing
      DEBUG: "False"
      REDIS_URL: ""
      FIREBASE_PROJECT_ID: ""
      GEMINI_API_KEY: ""
      YOUTUBE_API_KEY: ""
      NEWSAPI_KEY: ""
      NEWSDATA_KEY: ""
      PODCASTINDEX_KEY: ""
      PODCASTINDEX_SECRET: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest-cov

      - name: Check app import
        run: |
          python -c "
          import sys, traceback
          try:
              from app.main import app
              print('App import OK')
          except Exception as e:
              traceback.print_exc()
              sys.exit(1)
          "

      - name: Run tests with coverage
        run: |
          pytest \
            --tb=long \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output
          path: backend-service/pytest-output.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-service/coverage.xml

  # ──────────────────────────────────────────────
  # Flutter — analyze + test
  # ──────────────────────────────────────────────
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Analyze (fail on errors only)
        run: |
          # Run analyze, capturing output (ignore exit code for now)
          flutter analyze --no-pub lib/ > analyze-output.txt 2>&1 || true
          echo "=== FLUTTER ANALYZE SUMMARY ==="
          tail -5 analyze-output.txt
          echo "=== ERRORS FOUND ==="
          if grep -E "^  error" analyze-output.txt; then
            echo "Failing due to errors above"
            exit 1
          else
            echo "No errors found — passing"
            exit 0
          fi

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: flutter-app/analyze-output.txt

      - name: Run unit tests
        run: flutter test --no-pub -r compact

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/
