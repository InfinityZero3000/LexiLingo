name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: AI Code Review
    # Only on PRs, never for bots, and comment triggers only from people with write access:
    # this job holds a model API key and write permissions, and a public repo lets anyone
    # comment on a PR.
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event.pull_request != null || github.event.issue.pull_request != null) &&
      (github.event_name == 'pull_request' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Don't block PRs if API key is missing or Gemini is unavailable
    continue-on-error: true

    steps:
      - name: Check GEMINI_API_KEY is configured
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not set; skipping AI review."
            echo "To enable it: Settings > Secrets and variables > Actions > New repository secret"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR Agent action step
        id: pragent
        if: steps.key.outputs.enabled == 'true'
        # Pinned: a third-party action that receives secrets must not follow a moving branch.
        uses: The-PR-Agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-2.5-flash"
          # pr-agent only knows the context window of models in its own
          # MAX_TOKENS table, and this one is not in it — without this every run
          # ends "Ensure gemini/gemini-2.5-flash is defined in MAX_TOKENS", so
          # the check has been failing on every PR for configuration reasons
          # rather than anything in the diff. 1,048,576 is Gemini 2.5 Flash's
          # input window.
          config.custom_model_max_tokens: "1048576"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
