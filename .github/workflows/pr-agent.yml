name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: AI Code Review
    # Only run for non-bot users and on PRs
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event.pull_request != null || github.event.issue.pull_request != null)
    # Don't block PRs if API key is missing or Gemini is unavailable
    continue-on-error: true

    steps:
      - name: Check GEMINI_API_KEY is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️  GEMINI_API_KEY secret is not set — skipping AI review."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: PR Agent action step
        id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "google/gemini-2.5-pro"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
