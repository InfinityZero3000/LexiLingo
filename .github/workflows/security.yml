name: Security

on:
  push:
    branches: [main, feature, "feature/**", develop, dev]
  pull_request:
    branches: [main, feature, "feature/**", develop, dev]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --location --silent --show-error \
            "${release_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt"

          (
            cd "${RUNNER_TEMP}"
            sha256sum --check --ignore-missing gitleaks-checksums.txt
            tar -xzf "${archive}" gitleaks
          )
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan current tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .

      - name: Scan full Git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="--all" .

  # Report-only: findings show in the log, never fail the run or gate a merge.
  # Requirements are ranges, so resolve them first (metadata only, no wheel downloads).
  dependency-audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pip-audit and uv
        run: pip install pip-audit uv

      - name: pip-audit backend-service
        continue-on-error: true
        working-directory: backend-service
        run: |
          uv pip compile requirements.txt --python-version 3.11 --no-header --no-annotate -q -o "${RUNNER_TEMP}/backend.txt"
          pip-audit -r "${RUNNER_TEMP}/backend.txt" --no-deps --disable-pip

      - name: pip-audit ai-service
        continue-on-error: true
        working-directory: ai-service
        run: |
          uv pip compile requirements.txt -c constraints-ai.txt --python-version 3.11 --python-platform x86_64-manylinux_2_34 --no-header --no-annotate -q -o "${RUNNER_TEMP}/ai.txt"
          pip-audit -r "${RUNNER_TEMP}/ai.txt" --no-deps --disable-pip

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: admin-service/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: pnpm audit admin-service
        continue-on-error: true
        working-directory: admin-service
        run: pnpm audit --prod --audit-level high
