<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{title}</title>
    <!-- Rendered with str.format: every CSS brace below is doubled. -->
    <style>
      a {{ color: #0D5FC4; }}
      @media (max-width: 480px) {{
        .ll-card {{ padding: 24px 20px !important; }}
        .ll-btn {{ width: 100% !important; }}
        .ll-btn a {{ display: block !important; text-align: center !important; }}
        .ll-digit {{ width: 36px !important; font-size: 24px !important; }}
      }}
      @media (prefers-color-scheme: dark) {{
        .ll-bg {{ background: #151C26 !important; }}
        .ll-card {{ background: #243241 !important; border-color: #3A4A5A !important; }}
        .ll-well, .ll-digit {{ background: #1A2431 !important; border-color: #3A4A5A !important; }}
        .ll-foot {{ display: none !important; }}
        .ll-h {{ color: #F2F7FD !important; }}
        .ll-t {{ color: #D5DEE9 !important; }}
        .ll-m {{ color: #A9B6C6 !important; }}
        .ll-m a, .ll-accent, .ll-digit {{ color: #8CC2FF !important; }}
      }}
    </style>
  </head>
  <body class="ll-bg" style="margin:0;padding:0;background:#F2F7FD;">
    <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">{preheader}</div>
    <table role="presentation" class="ll-bg" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F2F7FD" style="background:#F2F7FD;">
      <tr>
        <td align="center" style="padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;">
            <tr>
              <td bgcolor="#0A4A9C" style="background:#0A4A9C;border-radius:20px 20px 0 0;overflow:hidden;line-height:0;font-size:0;">
                <a href="{home_url}" style="text-decoration:none;">
                  <img src="{hero_url}" width="520" height="180" alt="{title}" style="display:block;width:100%;max-width:520px;height:auto;border:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;line-height:1.3;font-weight:800;color:#FFFFFF;" />
                </a>
              </td>
            </tr>
            <tr>
              <td class="ll-card" bgcolor="#FFFFFF" style="background:#FFFFFF;border:1px solid #E1EAF5;border-top:0;border-radius:0 0 20px 20px;padding:32px;text-align:left;">
{content}
              </td>
            </tr>
            <tr>
              <td class="ll-m" align="center" style="padding:20px 4px 16px;font-size:13px;line-height:1.6;color:#5B6B7F;">
                Questions? Write to <a href="mailto:{support_email}" style="color:#0D5FC4;">{support_email}</a><br />
                LexiLingo &middot; <a href="{home_url}" style="color:#5B6B7F;">lexilingo.me</a>
              </td>
            </tr>
            <tr>
              <td class="ll-foot" style="border-radius:0 0 20px 20px;overflow:hidden;line-height:0;font-size:0;">
                <img src="{footer_url}" width="520" alt="" style="display:block;width:100%;max-width:520px;height:auto;border:0;" />
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
