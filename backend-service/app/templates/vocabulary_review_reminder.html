<!doctype html>
<html>
  <body style="margin:0;background:#f6f8fb;font-family:Arial,sans-serif;color:#111827">
    <div style="max-width:560px;margin:0 auto;padding:32px 16px">
      <div style="background:#ffffff;border-radius:16px;padding:28px;border:1px solid #e5e7eb">
        <h1 style="font-size:24px;line-height:1.25;margin:0 0 12px;color:#0f172a">Time to review</h1>
        <p style="font-size:16px;line-height:1.6;margin:0 0 16px">Hi {display_name},</p>
        <p style="font-size:16px;line-height:1.6;margin:0 0 24px">
          You have <strong>{due_count}</strong> vocabulary review(s) waiting in LexiLingo.
        </p>
        <a href="{review_link}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:700">
          Review now
        </a>
        <p style="font-size:13px;line-height:1.6;margin:24px 0 0;color:#6b7280">
          You can change reminder settings at
          <a href="{settings_link}" style="color:#2563eb">LexiLingo settings</a>.
        </p>
      </div>
      <p style="font-size:12px;line-height:1.5;text-align:center;color:#6b7280;margin:16px 0 0">
        Sent by LexiLingo. Need help? Contact {support_email}.
      </p>
    </div>
  </body>
</html>
