# Render.com deployment configuration for LexiLingo Backend
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # Backend API Service
  - type: web
    name: lexilingo-backend
    env: python
    region: singapore  # Closest to Vietnam
    plan: free  # 750 hours/month free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      chmod +x scripts/entrypoint.sh
    startCommand: bash scripts/entrypoint.sh
    healthCheckPath: /health
    
    # Auto-deploy on git push
    autoDeploy: true
    branch: main
    
    # Environment variables
    envVars:
      # Database (từ Supabase)
      - key: DATABASE_URL
        sync: false  # Nhập manual: postgresql://user:pass@host:5432/db
      
      # AI Service (public production gateway)
      - key: AI_SERVICE_URL
        value: https://api.lexilingo.me/api/v1

      - key: AI_ADMIN_API_KEY
        sync: false  # Must match ai-service AI_ADMIN_API_KEY
      
      # JWT Secret
      - key: SECRET_KEY
        generateValue: true  # Auto-generate random secret
      
      - key: ALGORITHM
        value: HS256
      
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      
      # Firebase (copy content từ firebase-service-account.json)
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false  # Paste JSON content manually
      
      - key: FIREBASE_PROJECT_ID
        sync: false
      
      # CORS Origins
      # GATEWAY_HANDLES_CORS is unset (defaults to false) — backend handles CORS
      # directly on Render since there is no Nginx gateway in the request path.
      # Set GATEWAY_HANDLES_CORS=true only if you add an Nginx/Kong gateway
      # in front of this service (gateway must use proxy_hide_header to avoid duplicates).
      - key: ALLOWED_ORIGINS
        value: https://lexilingo.me,https://www.lexilingo.me,https://admin.lexilingo.me
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: https?://([a-zA-Z0-9-]+\.)*lexilingo\.me(:\d+)?
      - key: ALLOWED_HOSTS
        value: api.lexilingo.me,lexilingo-backend.onrender.com
      
      # Environment
      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: LOG_LEVEL
        value: INFO

      # Email (SMTP) — required for forgot-password / verify-email to actually send.
      # Without these, EmailService logs a warning and skips sending, but the
      # /forgot-password endpoint still returns success (by design, to avoid
      # leaking which emails are registered).
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_SSL
        value: "true"
      - key: SMTP_USERNAME
        sync: false  # Nhập manual: Gmail address used to send
      - key: SMTP_PASSWORD
        sync: false  # Nhập manual: Gmail App Password (not the account password)
      - key: EMAIL_FROM
        value: thefirestar312@gmail.com
      - key: PASSWORD_RESET_URL_BASE_PRODUCTION
        value: lexilingo-app://reset-password
      - key: EMAIL_VERIFICATION_URL_BASE_PRODUCTION
        value: https://lexilingo.me/verify-email

      # Redis (optional - dùng Upstash free tier)
      - key: REDIS_URL
        sync: false  # redis://default:pass@host:port
      
    # Health check settings
    healthCheck:
      path: /health
      interval: 30s
      timeout: 10s
      unhealthyThreshold: 3

  - type: worker
    name: lexilingo-reminder-worker
    env: python
    region: singapore
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: REMINDERS_ENABLED
        value: "false"
      - key: REMINDER_DRY_RUN
        value: "true"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false

  - type: worker
    name: lexilingo-reminder-beat
    env: python
    region: singapore
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app:celery_app beat --loglevel=INFO
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: REMINDERS_ENABLED
        value: "false"
      - key: REMINDER_DRY_RUN
        value: "true"

# Note: After deployment, update these values:
# 1. DATABASE_URL: Connection string từ Supabase
# 2. FIREBASE_CREDENTIALS_JSON: Content của firebase-service-account.json
# 3. ALLOWED_ORIGINS/ALLOWED_HOSTS nếu bổ sung domain chính thức
