# One file per project in the edge proxy's conf.d/ (e.g. /home/ubuntu/workplace/gateway/conf.d/lexilingo.conf).
# The edge terminates TLS; the project listens on plain HTTP inside its LXD container.
# Issue the certificate first:  certbot certonly --webroot -w /var/www/certbot -d api.lexilingo.me

server {
    listen 80;
    server_name api.lexilingo.me;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.lexilingo.me;

    ssl_certificate     /etc/letsencrypt/live/api.lexilingo.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lexilingo.me/privkey.pem;

    client_max_body_size 25m;   # IELTS audio and content-agent uploads

    location / {
        proxy_pass http://10.77.0.10:80;          # the container's fixed IP
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;     # streaming chat / websockets
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;                              # AI answers stream for a while
        proxy_buffering off;
    }
}

# Needed once in nginx.conf (http block) if it is not there yet:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
