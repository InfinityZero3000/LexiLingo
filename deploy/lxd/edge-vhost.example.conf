# Edge proxy vhost for LexiLingo. Install as <gateway>/conf.d/lexilingo/lexilingo.conf
# (the shared nginx loads conf.d/*/*.conf). Step-by-step: docs/operations/PROXY_DNS_SETUP.md
#
# Cloudflare sits in front (SSL mode "Full (strict)"), so the certificate here is a
# Cloudflare Origin Certificate stored at conf.d/lexilingo/ssl/ (not *.conf, so it is
# never loaded as config). Until the Origin Certificate is installed, a self-signed one works
# with Cloudflare SSL mode "Full". Install a certificate BEFORE loading this file: a vhost
# pointing at a missing certificate stops the shared nginx from restarting.

# Own variable name: the shared nginx may already define $connection_upgrade for other projects.
map $http_upgrade $lexi_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.lexilingo.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.lexilingo.me;

    ssl_certificate     /etc/nginx/conf.d/lexilingo/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/lexilingo/ssl/origin.key;

    client_max_body_size 25m;   # IELTS audio and content-agent uploads

    location / {
        proxy_pass http://10.77.0.10:80;          # the LXD container's fixed IP
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;   # real visitor IP, used for rate limits
        proxy_set_header Upgrade           $http_upgrade;            # streaming chat / voice websockets
        proxy_set_header Connection        $lexi_connection_upgrade;
        proxy_read_timeout 300s;                                     # AI answers stream for a while
        proxy_buffering off;
    }
}
