[Definition]
# Catch IPs that generate a high volume of 404 responses — typical behaviour
# of directory/path scanners (dirbuster, gobuster, wfuzz, etc.).
# Reads from security.log (JSON format); all 4xx/5xx are written there.

failregex = ^\{.*"remote_addr":"<HOST>".*"status":404,.*\}$

ignoreregex = ^\{.*"remote_addr":"<HOST>".*"uri":"/favicon\.ico".*\}$
              ^\{.*"remote_addr":"<HOST>".*"uri":"/robots\.txt".*\}$
