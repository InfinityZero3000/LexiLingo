[Definition]
# Match lines from /opt/lexilingo/gateway/nginx/logs/security.log (JSON format).
# Each regex must match the full JSON line; <HOST> is replaced by fail2ban.

failregex = ^\{.*"remote_addr":"<HOST>".*"status":429,.*\}$
            ^\{.*"remote_addr":"<HOST>".*"uri":"/(?:\.git|\.env|\.svn|wp-config\.php|phpinfo\.php|actuator|cgi-bin/|etc/passwd|proc/self/environ|vendor/|admin/config\.php)[^"]*".*\}$
            ^\{.*"remote_addr":"<HOST>".*"uri":"[^"]*\.php[^"]*".*"status":4[0-9][0-9],.*\}$
            ^\{.*"remote_addr":"<HOST>".*"uri":"[^"]*eval-stdin[^"]*".*\}$
            ^\{.*"remote_addr":"<HOST>".*"uri":"[^"]*allow_url_include[^"]*".*\}$

