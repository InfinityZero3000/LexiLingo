name: lexilingo_admin
description: "LexiLingo Admin — Mobile admin panel for LexiLingo platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  shimmer: ^3.0.0
  fl_chart: ^0.71.0
  cached_network_image: ^3.4.1
  pinput: ^6.0.2
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
