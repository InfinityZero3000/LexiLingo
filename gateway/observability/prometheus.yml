global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: backend-service
    metrics_path: /health
    static_configs:
      - targets:
          - backend-service:8000

  - job_name: ai-service
    metrics_path: /health
    static_configs:
      - targets:
          - ai-service:8001
