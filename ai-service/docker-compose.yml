services:
  # AI Service (FastAPI)
  ai-service:
    build: .
    container_name: lexilingo-ai-service
    init: true
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALGORITHM=${ALGORITHM:-HS256}
      - AI_ADMIN_API_KEY=${AI_ADMIN_API_KEY:?Set AI_ADMIN_API_KEY in .env}
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=lexilingo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - ./api:/app/api
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload
    security_opt:
      - no-new-privileges:true
    networks:
      - lexilingo

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: lexilingo-mongo
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=lexilingo
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexilingo

  # Mongo Express (Web UI)
  mongo-express:
    image: mongo-express:1.0.2@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    container_name: lexilingo-mongo-express
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in .env}
    depends_on:
      - mongodb
    networks:
      - lexilingo

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: lexilingo-redis
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lfu
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexilingo

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  lexilingo:
    driver: bridge
