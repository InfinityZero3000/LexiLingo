# Crowdin Configuration for LexiLingo Flutter App
# Docs: https://support.crowdin.com/configuration-file/

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  # Vietnamese is the source language
  - source: /assets/i18n/vi.json
    translation: /assets/i18n/%two_letters_code%.json
    type: json
    
    # Scheme for translation files
    # %two_letters_code% = en, ja, ko, etc.
    
    # Update behavior
    update_option: update_as_unapproved
    
    # Exclude auto-generated keys
    excluded_target_languages: []
    
    # Content segmentation
    content_segmentation: true
    
    # Translation memory
    translate_hidden: false
